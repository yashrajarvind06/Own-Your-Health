# Render's free plan sleeps after 15 minutes without traffic; a request every 10 minutes keeps it up.
# One free service running all month (~744 h) fits in Render's 750 free hours.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://ownyourhealth.onrender.com/reports/types
